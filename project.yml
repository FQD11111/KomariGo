name: KomariGo
options:
  bundleIdPrefix: com.lcdcxp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  KomariGo:
    type: application
    platform: iOS
    sources:
      - path: KomariGo
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lcdcxp.komarigo
        PRODUCT_NAME: KomariGo
        MARKETING_VERSION: "1.7.0"
        CURRENT_PROJECT_VERSION: "10"
        INFOPLIST_FILE: KomariGo/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
