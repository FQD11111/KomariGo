name: ios

on:
  push:
    branches: [ main ]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project KomariGo.xcodeproj \
            -scheme KomariGo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KomariGo.app Payload/
          zip -qr KomariGo-unsigned.ipa Payload
          ls -lh KomariGo-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/KomariGo-unsigned.ipa
